spring.application.name=crypto-trading
spring.datasource.url=jdbc:h2:mem:crypto_trading;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
api.binance.base-url=https://api.binance.com
api.binance.tickers.path=/api/v3/ticker/bookTicker
api.huobi.base-url=https://api.huobi.pro
api.huobi.tickers.path=/market/tickers
crypto.tickers.supported=ETHUSDT,BTCUSDT
scheduler.price-poll-interval-ms=10000